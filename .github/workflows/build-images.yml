name: "Build & Publish Images"

# Builds the portfolio + admin images on GitHub's runners and pushes to GHCR.
# The deploy workflows trigger off this one completing (workflow_run) and just
# pull + restart on the self-hosted runner — no building on the host.
#
# Tagging scheme (docker/metadata-action):
#   push to main    → :main, :latest, :sha-<short>
#   push to staging → :staging, :sha-<short>
#   tag v1.2.3      → :1.2.3, :1.2, :latest, :sha-<short>
#
# NEXT_PUBLIC_* values are baked into the portfolio image at build time. They
# are PUBLIC by definition (they ship in the JS bundle to every visitor), but
# they still live in repository Variables rather than the repo itself:
# Settings → Secrets and variables → Actions → Variables:
#   PROD_UMAMI_SCRIPT_URL,    PROD_UMAMI_WEBSITE_ID,    PROD_ENABLE_ANALYTICS
#   STAGING_UMAMI_SCRIPT_URL, STAGING_UMAMI_WEBSITE_ID, STAGING_ENABLE_ANALYTICS
# Unset variables simply mean analytics is off in that image.

on:
  push:
    branches:
      - main
      - staging
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-portfolio:
    name: "Build portfolio image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Staging builds bake the staging Umami values; everything else (main,
      # version tags) bakes prod's.
      - name: Select analytics build args
        id: analytics
        run: |
          if [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "enable=${{ vars.STAGING_ENABLE_ANALYTICS || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "script_url=${{ vars.STAGING_UMAMI_SCRIPT_URL || '' }}"  >> "$GITHUB_OUTPUT"
            echo "website_id=${{ vars.STAGING_UMAMI_WEBSITE_ID || '' }}"  >> "$GITHUB_OUTPUT"
          else
            echo "enable=${{ vars.PROD_ENABLE_ANALYTICS || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "script_url=${{ vars.PROD_UMAMI_SCRIPT_URL || '' }}"  >> "$GITHUB_OUTPUT"
            echo "website_id=${{ vars.PROD_UMAMI_WEBSITE_ID || '' }}"  >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.portfolio
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ENABLE_ANALYTICS=${{ steps.analytics.outputs.enable }}
            NEXT_PUBLIC_UMAMI_SCRIPT_URL=${{ steps.analytics.outputs.script_url }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ steps.analytics.outputs.website_id }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,scope=portfolio,mode=max

  build-admin:
    name: "Build admin image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-admin
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.admin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
