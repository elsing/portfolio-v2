name: "Build & Deploy"

# One pipeline: build the portfolio + admin images on GitHub's cloud runners,
# push to GHCR, then deploy on the self-hosted runner (pull + restart — no
# building on the host). Everything runs from THIS branch's copy of the file,
# so a push to staging builds AND deploys staging with no dependency on main.
#
#   push to staging → build :staging images → deploy staging
#   push to main    → build :main images    → deploy prod
#   tag v*          → build versioned images only (no deploy)
#
# Tagging scheme (docker/metadata-action):
#   push to main    → :main, :latest, :sha-<short>
#   push to staging → :staging, :sha-<short>
#   tag v1.2.3      → :1.2.3, :1.2, :latest, :sha-<short>
#
# NEXT_PUBLIC_* values are baked into the portfolio image at build time. They
# are PUBLIC by definition (they ship in the JS bundle to every visitor), but
# they still live in repository Variables rather than the repo itself:
# Settings → Secrets and variables → Actions → Variables:
#   PROD_UMAMI_URL,    PROD_UMAMI_WEBSITE_ID,    PROD_ENABLE_ANALYTICS,    PROD_ENABLE_REPLAY
#   STAGING_UMAMI_URL, STAGING_UMAMI_WEBSITE_ID, STAGING_ENABLE_ANALYTICS, STAGING_ENABLE_REPLAY
# UMAMI_URL is the instance base (e.g. https://analytics.example.com) —
# script.js/recorder.js are derived from it. Unset analytics vars mean
# analytics is off; replay defaults ON whenever analytics is on
# (set *_ENABLE_REPLAY=false to opt out).

on:
  push:
    branches:
      - main
      - staging
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-portfolio:
    name: "Build portfolio image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Staging builds bake the staging Umami values; everything else (main,
      # version tags) bakes prod's.
      - name: Select analytics build args
        id: analytics
        run: |
          if [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "enable=${{ vars.STAGING_ENABLE_ANALYTICS || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "replay=${{ vars.STAGING_ENABLE_REPLAY || 'true' }}"     >> "$GITHUB_OUTPUT"
            echo "umami_url=${{ vars.STAGING_UMAMI_URL || '' }}"          >> "$GITHUB_OUTPUT"
            echo "website_id=${{ vars.STAGING_UMAMI_WEBSITE_ID || '' }}"  >> "$GITHUB_OUTPUT"
          else
            echo "enable=${{ vars.PROD_ENABLE_ANALYTICS || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "replay=${{ vars.PROD_ENABLE_REPLAY || 'true' }}"     >> "$GITHUB_OUTPUT"
            echo "umami_url=${{ vars.PROD_UMAMI_URL || '' }}"          >> "$GITHUB_OUTPUT"
            echo "website_id=${{ vars.PROD_UMAMI_WEBSITE_ID || '' }}"  >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.portfolio
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ENABLE_ANALYTICS=${{ steps.analytics.outputs.enable }}
            NEXT_PUBLIC_ENABLE_REPLAY=${{ steps.analytics.outputs.replay }}
            NEXT_PUBLIC_UMAMI_URL=${{ steps.analytics.outputs.umami_url }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ steps.analytics.outputs.website_id }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,scope=portfolio,mode=max

  build-admin:
    name: "Build admin image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-admin
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.admin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

  deploy:
    name: "Deploy ${{ github.ref_name == 'main' && 'production' || 'staging' }}"
    needs: [build-portfolio, build-admin]
    # Branch pushes only — version tags publish images without deploying
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: [docker, self-hosted]
    permissions:
      contents: read
      packages: read

    steps:
      # Per-environment config from repository Variables — the server's
      # layout never appears in this public repo. Ports fall back to the
      # compose defaults (3000/9000 prod, 3001/9001 staging) when unset.
      - name: Select environment config
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "PORTFOLIO_BASE=${{ vars.PORTFOLIO_BASE_PROD }}" >> "$GITHUB_ENV"
            echo "PORTFOLIO_PORT=${{ vars.PORTFOLIO_PORT }}"      >> "$GITHUB_ENV"
            echo "ADMIN_PORT=${{ vars.ADMIN_PORT }}"              >> "$GITHUB_ENV"
            echo "COMPOSE_DIR=prod"                               >> "$GITHUB_ENV"
          else
            echo "PORTFOLIO_BASE=${{ vars.PORTFOLIO_BASE_STAGING }}" >> "$GITHUB_ENV"
            echo "PORTFOLIO_PORT=${{ vars.PORTFOLIO_PORT_STAGING }}" >> "$GITHUB_ENV"
            echo "ADMIN_PORT=${{ vars.ADMIN_PORT_STAGING }}"         >> "$GITHUB_ENV"
            echo "COMPOSE_DIR=staging"                               >> "$GITHUB_ENV"
          fi

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The canonical compose file lives in the environment's base dir (host
      # filesystem, mounted into the runner at the same path) — not in the
      # runner's ephemeral checkout. This also lets you manage the stack
      # manually from the host: cd $PORTFOLIO_BASE && docker compose ps/logs.
      - name: Install compose file into base dir
        run: cp "docker/$COMPOSE_DIR/docker-compose.yml" "$PORTFOLIO_BASE/docker-compose.yml"

      - name: Pull latest images
        run: docker compose -f "$PORTFOLIO_BASE/docker-compose.yml" pull

      - name: Restart containers
        run: docker compose -f "$PORTFOLIO_BASE/docker-compose.yml" up -d
