name: "Portfolio V3 - Production Deployment"

# Runs after "Build & Publish Images" succeeds for the main branch, on the
# self-hosted runner: pull the fresh :main images from GHCR and restart.
#
# The per-environment base directory is injected from the PORTFOLIO_BASE_PROD
# repository Variable (Settings → Secrets and variables → Actions → Variables)
# so the server's layout never appears in this public repo.

on:
  workflow_run:
    workflows: ["Build & Publish Images"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    name: "Deploy production"
    runs-on: [docker, self-hosted]
    # Only when the build succeeded AND it was a main-branch build
    # (workflow_dispatch runs unconditionally for manual deploys)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      packages: read

    env:
      PORTFOLIO_BASE: ${{ vars.PORTFOLIO_BASE_PROD }}
      # Optional port overrides — compose falls back to 3000/9000 if unset
      PORTFOLIO_PORT: ${{ vars.PORTFOLIO_PORT }}
      ADMIN_PORT:     ${{ vars.ADMIN_PORT }}

    steps:
      # Checkout the same commit the images were built from
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The canonical compose file lives in the environment's base dir (host
      # filesystem, mounted into the runner at the same path) — not in the
      # runner's ephemeral checkout. This also lets you manage the stack
      # manually from the host: cd $PORTFOLIO_BASE && docker compose ps/logs.
      - name: Install compose file into base dir
        run: cp docker/prod/docker-compose.yml "$PORTFOLIO_BASE/docker-compose.yml"

      - name: Pull latest images
        run: docker compose -f "$PORTFOLIO_BASE/docker-compose.yml" pull

      - name: Restart containers
        run: docker compose -f "$PORTFOLIO_BASE/docker-compose.yml" up -d
