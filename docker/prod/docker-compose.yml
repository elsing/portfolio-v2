name: portfolio-v2-prod

services:
  portfolio-v3-prod:
    container_name: portfolio-v3-prod
    ports:
      - 3000:3000
    image: portfolio-v3-prod:latest
    networks:
      traefik_proxy:
        aliases:
          - portfolio-v3-prod
    restart: unless-stopped

networks:
  traefik_proxy:
    external: true