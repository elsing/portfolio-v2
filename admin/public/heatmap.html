<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>heatmap — portfolio-admin</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <nav>
    <span class="brand">portfolio-admin</span>
    <a href="/">stats</a>
    <a href="/logs.html">ai logs</a>
    <a href="/heatmap.html" class="active">heatmap</a>
    <button class="logout" id="logout">log out</button>
  </nav>

  <main style="max-width: 1500px">
    <h1>click heatmap</h1>

    <div class="controls">
      <select id="path"></select>
      <select id="device">
        <option value="">all devices</option>
        <option value="desktop">desktop (≥1024)</option>
        <option value="tablet">tablet (768–1023)</option>
        <option value="mobile">mobile (&lt;768)</option>
      </select>
      <select id="days">
        <option value="7">last 7 days</option>
        <option value="30" selected>last 30 days</option>
        <option value="90">last 90 days</option>
        <option value="0">all time</option>
      </select>
      <select id="width">
        <option value="1440" selected>render @1440px</option>
        <option value="390">render @390px (mobile)</option>
      </select>
      <span class="muted" id="count"></span>
    </div>

    <p class="muted" style="margin-bottom:14px">
      overlay is approximate — clicks are stored as page-relative fractions across many
      visitor screen sizes, then re-projected onto this one render width.
    </p>

    <div class="heatmap-stage" id="stage">
      <iframe id="pageFrame" scrolling="no"></iframe>
      <canvas id="heat"></canvas>
    </div>
  </main>

  <script>
    // Site origin the iframe loads from. Admin runs on the LAN but the public
    // site is reachable from there — same origin the visitors saw.
    const SITE_ORIGIN = 'https://singer.systems';

    const $ = id => document.getElementById(id);

    /* ── Minimal canvas heatmap (heatmap.js technique, no dependency) ──
       1. Paint each point as a black radial gradient on an offscreen canvas
          (alpha accumulates where clicks overlap).
       2. Colorize: map accumulated alpha through a gradient palette.       */
    function renderHeatmap(canvas, points, radius = 22) {
      const { width, height } = canvas;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, width, height);
      if (!points.length) return;

      const shadow = document.createElement('canvas');
      shadow.width = width; shadow.height = height;
      const sctx = shadow.getContext('2d');

      for (const p of points) {
        const g = sctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius);
        g.addColorStop(0, 'rgba(0,0,0,0.35)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        sctx.fillStyle = g;
        sctx.fillRect(p.x - radius, p.y - radius, radius * 2, radius * 2);
      }

      // palette: transparent → blue → green → yellow → red
      const grad = document.createElement('canvas');
      grad.width = 256; grad.height = 1;
      const gctx = grad.getContext('2d');
      const lg = gctx.createLinearGradient(0, 0, 256, 0);
      lg.addColorStop(0.0, 'rgba(91,159,212,0)');
      lg.addColorStop(0.25, 'rgba(91,159,212,0.7)');
      lg.addColorStop(0.55, 'rgba(61,219,114,0.75)');
      lg.addColorStop(0.8, 'rgba(212,168,75,0.8)');
      lg.addColorStop(1.0, 'rgba(224,80,80,0.85)');
      gctx.fillStyle = lg;
      gctx.fillRect(0, 0, 256, 1);
      const palette = gctx.getImageData(0, 0, 256, 1).data;

      const img = sctx.getImageData(0, 0, width, height);
      const out = ctx.createImageData(width, height);
      for (let i = 0; i < img.data.length; i += 4) {
        const alpha = img.data[i + 3];
        if (!alpha) continue;
        const idx = Math.min(255, alpha) * 4;
        out.data[i]     = palette[idx];
        out.data[i + 1] = palette[idx + 1];
        out.data[i + 2] = palette[idx + 2];
        out.data[i + 3] = palette[idx + 3];
      }
      ctx.putImageData(out, 0, 0);
    }

    async function loadPaths() {
      const res = await fetch('/api/clicks/paths');
      if (res.status === 401) { window.location.href = '/login.html'; return []; }
      return res.json();
    }

    async function draw() {
      const pagePath = $('path').value || '/';
      const days     = parseInt($('days').value, 10);
      const from     = days ? Date.now() - days * 86400000 : 0;
      const renderW  = parseInt($('width').value, 10);

      const params = new URLSearchParams({ path: pagePath, from, to: Date.now() });
      if ($('device').value) params.set('device', $('device').value);
      const clicks = await (await fetch(`/api/clicks?${params}`)).json();
      $('count').textContent = `${clicks.length} clicks`;

      const frame = $('pageFrame');
      const canvas = $('heat');
      const stage = $('stage');

      stage.style.width = `${renderW}px`;
      frame.style.width = `${renderW}px`;
      frame.src = SITE_ORIGIN + pagePath;

      frame.onload = () => {
        // Cross-origin iframe: can't measure its content height, so derive a
        // render height from the average stored page-height aspect per click,
        // falling back to 3x viewport.
        const avgAspect = clicks.length
          ? clicks.reduce((s, c) => s + c.page_h / c.viewport_w, 0) / clicks.length
          : 3;
        const renderH = Math.max(800, Math.round(renderW * avgAspect));
        frame.style.height = `${renderH}px`;
        canvas.width  = renderW;
        canvas.height = renderH;

        renderHeatmap(canvas, clicks.map(c => ({
          x: c.x * renderW,
          y: c.y * renderH,
        })));
      };
    }

    async function init() {
      const paths = await loadPaths();
      $('path').innerHTML = paths.length
        ? paths.map(p => `<option value="${encodeURI(p.path)}">${p.path} (${p.n})</option>`).join('')
        : '<option value="/">/ (no data yet)</option>';

      ['path', 'device', 'days', 'width'].forEach(id =>
        $(id).addEventListener('change', draw));
      draw();
    }

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    init();
  </script>
</body>
</html>
